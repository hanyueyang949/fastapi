<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Pista de tenis con pelota y raqueta">
  <defs>
    <linearGradient id="cieloTenis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset=".55" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#cieloTenis)"/>

  <!-- Pista en perspectiva -->
  <path d="M60 360 L190 180 L450 180 L580 360 Z" fill="#16a34a" opacity=".9"/>
  <path d="M60 360 L190 180 L450 180 L580 360 Z" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <path d="M95 330 L200 210 L440 210 L505 330 Z" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <path d="M150 270 L490 270" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Red -->
  <path d="M320 180 L320 360" stroke="#f8fafc" stroke-width="5" opacity=".9"/>
  <path d="M300 215 L340 215" stroke="#f8fafc" stroke-width="4" opacity=".7"/>

  <!-- Sombras y pelota -->
  <ellipse cx="470" cy="300" rx="34" ry="7" fill="#052e16" opacity=".35"/>
  <circle cx="470" cy="268" r="22" fill="#facc15"/>
  <path d="M452 258 q18 10 0 20" fill="none" stroke="#fefce8" stroke-width="3"/>
  <path d="M488 258 q-18 10 0 20" fill="none" stroke="#fefce8" stroke-width="3"/>

  <!-- Raqueta -->
  <g transform="rotate(-24 150 120)" opacity=".95">
    <ellipse cx="150" cy="120" rx="46" ry="60" fill="none" stroke="#f8fafc" stroke-width="7"/>
    <path d="M150 60 L150 180 M104 100 L196 100 M104 140 L196 140 M120 70 L120 170 M180 70 L180 170"
          stroke="#f8fafc" stroke-width="2" opacity=".55"/>
    <path d="M150 180 L150 250" stroke="#f8fafc" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
